name: Release

# Pushing a tag like v0.2.0 (done at the end of each sprint, see CONTRIBUTING.md) publishes a GitHub Release
# whose notes GitHub generates from the PRs merged since the previous tag (their titles are the squash commits).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
